    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggleButton = document.querySelector(".nav-toggle");
            const navContainer = document.querySelector(".navbar-nav-container");

            toggleButton.addEventListener("click", () => {
                navContainer.classList.toggle("active");
                const isExpanded =
                    toggleButton.getAttribute("aria-expanded") === "true";
                toggleButton.setAttribute("aria-expanded", !isExpanded);
            });

            document
                .querySelectorAll(".navbar-nav-pages .nav-link")
                .forEach((link) => {
                    link.addEventListener("click", () => {
                        if (navContainer.classList.contains("active")) {
                            navContainer.classList.remove("active");
                            toggleButton.setAttribute("aria-expanded", "false");
                        }
                    });
                });
        });
        // Función para obtener parámetros de la URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Obtener el parámetro "id" de la URL
        const productId = getQueryParam("id");

        // Función para renderizar los detalles del producto
        function renderProductDetail(product) {
            if (!product) {
                document.getElementById("product-detail").innerHTML =
                    "<p>Producto no encontrado.</p>";
                return;
            }

            const secondaryImages = Array.isArray(product.imagenes_secundarias)
                ? product.imagenes_secundarias
                : [];

            // Crear un array de imágenes que se mostrarán en el carrusel
            const carouselItems = secondaryImages.flatMap((img) => {
                const items = [
                    { src: img.url, alt: "Imagen URL" },
                    { src: img.perfil, alt: "Imagen Perfil" },
                ];

                // Solo agregar la imagen de detalle si existe
                if (img.detalle) {
                    items.push({ src: img.detalle, alt: "Imagen Detalle" });
                }

                return items;
            });
            
          //  <p><strong>Colores sin stock:</strong> <span id="out-of-stock-colors"></span></p>
            const detailHTML = `
        <h2>${product.codigo}</h2>
        <h3>${product.descripcion}</h3>
        <h4>Colección: ${product.coleccion}</h4>
        <p><strong>Material:</strong> ${product.material}</p>
        <p><strong>Categoría:</strong> ${product.categoria}</p>
        <p><strong>Color Activo:</strong> <span id="active-color">${secondaryImages[0]?.color || 'N/A'}</span></p>
        <!-- Carrusel de imágenes -->

        <div id="carouselImages" class="carousel slide" data-bs-ride="false">
           <div class="carousel-inner">
            ${carouselItems
                    .map(
                        (item, index) => `
                <div class="carousel-item ${index === 0 ? "active" : ""}">
                    <img src="${item.src}" class="d-block w-100" alt="${item.alt}">
                </div>
            `
                    )
                    .join("")}
           </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselImages" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselImages" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Siguiente</span>
            </button>
        </div>
        <div class="mt-3 d-flex" ;">
           ${secondaryImages.length > 1 ? `
    <div class="mt-3 d-flex">
        ${secondaryImages
            .map((img, index) => {
                const widthPercentage = (100 / secondaryImages.length).toFixed(2);
                return `
                    <div style="width:${widthPercentage}%; cursor: pointer; object-fit:contain;">
                        <img src="${img.url}" alt="Miniatura ${index + 1}" class="img-thumbnail thumbnail-img">
                    </div>
                `;
            })
            .join("")}
    </div>
` : ""}

        </div>
    `;

            document.getElementById("product-detail").innerHTML = detailHTML;

            // Update active color and out-of-stock colors
            const activeImageIndex = 0; // Assuming the first image is active
            const activeColor = secondaryImages[activeImageIndex]?.color || 'N/A';
            document.getElementById("active-color").textContent = activeColor;

       /*     const outOfStockColors = secondaryImages
                .filter(img => img.stock <= 0)
                .map(img => img.color)
                .join(', ');
            document.getElementById("out-of-stock-colors").textContent = outOfStockColors || 'Ninguno';

*/
            // Configurar los eventos de clic en las miniaturas
            const thumbnails = document.querySelectorAll(".thumbnail-img");
            thumbnails.forEach((thumb, index) => {
                const carouselIndex = index * 2; // Corrected index for active color
                thumb.addEventListener("click", () => {
                    const carousel = new bootstrap.Carousel(
                        document.getElementById("carouselImages")
                    );
                    carousel.to(carouselIndex); // Ir a la posición personalizada
                });
            });

            // Update active color on carousel slide
            const carouselElement = document.getElementById('carouselImages');
            carouselElement.addEventListener('slid.bs.carousel', () => {
                const activeItem = carouselElement.querySelector('.carousel-item.active img');
                const activeIndex = Array.from(carouselElement.querySelectorAll('.carousel-item')).indexOf(activeItem.parentElement);
                const newActiveColor = secondaryImages[Math.floor(activeIndex / 2)]?.color || 'N/A'; // Adjusted to change color every two images
                document.getElementById("active-color").textContent = newActiveColor;
            });
        }
        // Función para obtener los detalles del producto
        function fetchProductDetail(id) {
            fetch(`./php/get_producto-detail.php?id=${id}`)
                .then((response) => {
                    if (!response.ok)
                        throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then((data) => {
                    if (data && data.id) {
                        renderProductDetail(data);
                    } else {
                        document.getElementById("product-detail").innerHTML =
                            "<p>Producto no encontrado.</p>";
                    }
                })
                .catch((error) => {
                    console.error("Error fetching product details:", error);
                    document.getElementById("product-detail").innerHTML =
                        "<p>Hubo un error al cargar los detalles del producto.</p>";
                });
        }

        // Verificar si se ha proporcionado un ID de producto
        if (productId) {
            fetchProductDetail(productId);
        } else {
            document.getElementById("product-detail").innerHTML =
                "<p>No se especificó un producto.</p>";
        }
    </script>
